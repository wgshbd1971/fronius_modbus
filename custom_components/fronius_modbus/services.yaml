set_generation_limit:
  name: Set generation limit
  description: Set the native REST output ceiling. 0 suppresses output; 100 releases the ceiling. Does not change inverter connection, grid export or cloud profiles.
  fields:
    entry_id:
      name: Fronius config entry
      required: true
      selector:
        config_entry:
          integration: fronius_modbus
    percent:
      name: Maximum output percentage
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
